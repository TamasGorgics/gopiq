# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.27.0"
          - os: ubuntu-latest
            go: "1.27.3"
          - os: macos-latest
            go: "1.27.3"
          - os: windows-latest
            go: "1.27.3"
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Lint
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.3'
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

    - name: Test and collect library coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.3'
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic -coverpkg=github.com/TamasGorgics/gopiq,github.com/TamasGorgics/gopiq/internal/engine,github.com/TamasGorgics/gopiq/internal/cli ./...

    - name: Test with race
      if: matrix.os == 'ubuntu-latest' && matrix.go != '1.27.3'
      run: go test -v -race ./...

    - name: Test
      if: matrix.os != 'ubuntu-latest'
      run: go test -v ./...

    - name: Fuzz decode limits
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.3'
      run: go test -run '^$' -fuzz=FuzzFromReaderWithLimits -fuzztime=10s .

    - name: Fuzz byte limits
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.3'
      run: go test -run '^$' -fuzz=FuzzFromBytesWithLimits -fuzztime=10s .

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.3'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
